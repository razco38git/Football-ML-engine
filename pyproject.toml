[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "footballml"
version = "0.1.0"
description = "Football match prediction, player ratings, and accuracy tracking"
requires-python = ">=3.11"
dependencies = [
    # 3.0, not 2.2: `groupby.apply` drops the group keys by default from 3.0,
    # which is the behaviour the three call sites in `features.rolling`,
    # `players.fifa` and `players.team_strength` depend on. Under 2.2 they had
    # to ask for it with `include_groups=False`, a keyword pandas-stubs does not
    # model, so `mypy src` could not check any of those calls. The project is
    # only ever run and tested against 3.x, so the floor now says so.
    "pandas>=3.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    # Core, not an ingest extra, despite only the fetchers calling it:
    # `api/app.py` imports `ingest.matchhistory` at module scope for `LEAGUES`
    # and `fetch_fixtures`, and that module imports `requests` at module scope.
    # So `pip install -e ".[api]"` produced an API that raised ImportError on
    # start. It only ever worked because `requests` arrived transitively.
    "requests>=2.31",
]

[project.optional-dependencies]
# Kept separate: soccerdata pulls seleniumbase/selenium, a heavyweight browser
# automation stack. Only the nightly ingest job needs it -- the API and the
# model training path must stay installable without it, which is why `requests`
# is a core dependency rather than living here.
ingest = [
    "soccerdata>=1.9.1",
]
model = [
    "lightgbm>=4.3",
    "shap>=0.45",
]
# Plotting for the one-off measurement harnesses under `footballml.experiments`.
# Not core: nothing the site serves draws a chart server-side -- the web app
# renders its own inline SVG -- so matplotlib is only ever needed by someone
# re-running an experiment, and `pipelines.ablation_ladder` degrades to writing
# the CSVs without it rather than failing.
experiments = [
    "matplotlib>=3.8",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "joblib>=1.3",
]
# Postgres is not wired up yet: predictions are stored as CSV via
# footballml.store, whose interface is narrow enough to swap backends later.
postgres = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/footballml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
ignore = [
    # PD901 (`df` is a fine name for a dataframe) was ignored here until ruff
    # removed the rule. Ignoring a rule that no longer exists is dead config,
    # and ruff warns about it on every lint run.
    "PD008",  # `.at` is the correct accessor for single-cell scalar access
]

[tool.mypy]
# Must match the interpreter CI runs on (`.github/workflows/ci.yml`), not the
# `requires-python` floor. `python_version = "3.11"` made `mypy src` abort
# before it checked a single line of this project: numpy ships `type` statements
# in its own stubs, which are 3.12 syntax, so mypy refused to parse numpy and
# gave up with one error. The type check has therefore never run on CI -- and
# the format check failing ahead of it meant nobody could see that either.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
