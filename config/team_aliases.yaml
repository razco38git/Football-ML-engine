# Canonical team names and their per-source aliases.
#
# GENERATED by `python -m pipelines.derive_aliases --write`. Re-run it after each
# season's promotions rather than editing by hand.
#
# Mappings are derived by matching fixtures on (date, home goals, away goals)
# within a league-season, not by comparing strings. That distinction matters:
# fuzzy matching would happily collapse `Real Betis`, `Real Sociedad` and
# `Real Valladolid` into one another.
#
# The canonical form follows football-data.co.uk, since those CSVs are the spine
# of the match dataset. A missing alias silently drops rows from a join, so
# resolution is strict and raises on unknown names.

