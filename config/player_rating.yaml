# Player rating configuration.
#
# Every judgement call lives here rather than in code, so the model can be
# argued with. If you think build-up play is undervalued for full-backs, change
# the number and re-run.
#
# How a rating is produced:
#   1. Each counting stat becomes a per-90 rate.
#   2. Within a role and season, each rate becomes a percentile against peers.
#      This is the free equivalent of a scouting percentile report, and it means
#      a centre-back is only ever compared with centre-backs.
#   3. Percentiles combine into sub-ratings using the weights below.
#   4. Sub-ratings combine into one composite.
#   5. The composite is shrunk toward the role mean for players with few
#      minutes, mapped onto 0-99 by `scale`, then blended with EA's overall.

# How much EA FC's overall contributes, against our performance rating.
#
# An even split. EA's ratings are balanced across positions by people who watch
# players and take no account of minutes; ours are grounded in what actually
# happened this season and move with form. Each covers the other's gap, and the
# measurement below says neither should lead.
#
# Swept 0.7 -> 0.0 over 32,078 player-seasons, scored by Spearman against team
# outcomes across 1,542 completed team-seasons (>= 30 matches). Only the
# right-hand block decides anything: the model joins strength from the
# *previous* season, so a same-season correlation flatters a rating that is
# partly a consequence of the season it describes.
#
#   weight | describes own season          | predicts next season
#          | atk>GF   def>GA   ovr>pts     | atk>GF   def>GA   ovr>pts
#     0.7  |  0.772   -0.544    0.749      |  0.696   -0.492    0.697
#     0.6  |  0.797   -0.545    0.767      |  0.707   -0.487    0.703
#  >> 0.5  |  0.819   -0.543    0.781      |  0.716   -0.480    0.707
#     0.4  |  0.838   -0.543    0.794      |  0.718   -0.479    0.710
#     0.3  |  0.851   -0.527    0.799      |  0.712   -0.460    0.708
#     0.2  |  0.858   -0.500    0.794      |  0.705   -0.434    0.699
#     0.0  |  0.849   -0.440    0.766      |  0.677   -0.379    0.663
#
# Prediction peaks on a plateau at 0.4-0.5 and falls away hard below it. 0.5 is
# taken over 0.4 because the 0.002 between them is noise, while the face
# validity is not: at 0.4 a full-back (Mittelstädt) enters the 2025/26 top ten,
# and Salah's poor season drops him to 86.
#
# The defence line pays for this -- -0.492 to -0.480 -- and that is accepted
# knowingly. Squad *overall* already predicts conceding better than the
# purpose-built defence number, and SHAP puts `strength_defence` 93rd of 125
# features; see the note under the CB defending weights. Below 0.4 the defence
# correlation collapses, which is the real floor here.
#
# What this buys in practice is that a season moves a rating: Yamal 90 -> 91 on
# a performance score of 92 against EA's 89, Kane 89 -> 90, while Salah's 81
# performance takes him 90 -> 88. Set to 0 to ignore FIFA entirely -- but note
# that is the worst setting measured, on every metric.
#
# EA's overall is mapped onto our scale by within-role percentile before
# blending, since the raw scales differ and averaging directly would let
# whichever is wider dominate. Players with no EA entry are not penalised for
# the gap, but see `unmatched_shrinkage_nineties` -- re-checked at 0.5 and still
# at parity (matched p95 81, unmatched 76, none in the top fifty), so it did not
# need retuning.
fifa_weight: 0.5

# How far that split shifts when a role could not be measured.
#
# `fifa_weight` above assumes both halves describe the same player. For a
# 2014/15 centre back the performance half describes 38% of one: FBref served
# no `misc` table, so `defending` -- 62% of the composite -- was refused and
# the rest was renormalised over the hole. Renormalising is right; presenting
# the result as half the rating is not.
#
#   w_eff = fifa_weight + (1 - fifa_weight) * unmeasured_shift * (1 - measured)
#
#   role  season     measured  w_eff
#   CB    1415/1516    0.38     0.81
#   FB    1415/1516    0.62     0.69
#   DM    1415/1516    0.80     0.60
#   MID   1415/1516    0.80     0.60
#   AMW   1415/1516    0.92     0.54
#   GK    1415         0.97     0.52
#   GK    1516         0.00     1.00   (EA alone -- already the behaviour)
#   everything 1617 on 1.00     0.50   (unchanged, bit for bit)
#
# Set to 0 to disable, which reproduces the `fifa_weight` sweep above exactly
# -- that is what it is for, and it is how this was attributed against the
# role-stability change rather than measured as one lump.
#
# What this is and is not. It is an honesty correction: a number built from a
# third of a role should not be presented as interchangeable with one built
# from all of it. It is NOT a rescue for the 2015/16 defender ratings. EA's own
# view of those squads is modest -- EA ranked Leicester's 18th of 20 -- so
# Leicester stay 15th either way, and EA-only was measured and is worse.
unmeasured_shift: 1.0

# Shrinkage for players with no EA entry, in 90-minute appearances.
#
# Blending pulls every matched player toward EA's clustered middle, so a player
# left unblended keeps an untempered percentile and lands in the tails far more
# often than his evidence justifies: unmatched players were ~16% of rated
# player-seasons but 11-18 of each season's top fifty. Their performance rating
# is shrunk toward the role-season mean with the same n / (n + k) form as
# `shrinkage_nineties`.
#
# k = 4 was chosen for distribution parity, not to empty the leaderboard: it
# brings the unmatched p95 (84) level with the matched p95 (81). k = 8, the
# value used for minutes, overshoots to 80 and under-represents them instead.
# Set to 0 to leave unmatched players unblended and unshrunk.
unmatched_shrinkage_nineties: 4

# How much of the composite is the player's single best sub-rating.
#
# A weighted mean of percentiles rewards all-rounders and punishes specialists
# from both ends, and the two ends arrived as the same complaint on the same
# day. Mane scored 22 in 2018/19 with one assist -- 97th percentile finishing,
# 36th creation -- and winger weights put creation at 0.34 against finishing's
# 0.28, so the rating was effectively tracking his assists: a 22-goal season
# rated below an 11-goal one. Van Dijk is the mirror image, elite at a job the
# data cannot see and dragged by tackle counts he has no need to accumulate.
#
# Pulling the composite toward the best sub-rating credits being outstanding at
# something. Swept over all 23,847 rated player-seasons, against the NEXT
# season's outcome:
#
#   k      atk>GF   ovr>pts   def>GA
#   0.00   0.6909    0.6770   -0.4400    <- weighted mean alone
#   0.10   0.6924    0.6797   -0.4451
#   0.15   0.6939    0.6807   -0.4474    <- this
#   0.20   0.6883    0.6812   -0.4454
#   0.30   0.6930    0.6803   -0.4476
#   0.40   0.6892    0.6825   -0.4483
#
# Every setting is inside noise of every other on these correlations, so they
# do not pick the number -- the backtest does. 0.30 was tried first and failed
# the gate: all three correlations improved while walk-forward five-league RPS
# regressed 0.2003 to 0.2008. That is the whole reason this is swept against a
# held-out metric and not against the table above.
#
# 0.15 holds the RPS and still moves the ratings the complaints were about:
# Mane 1819 76 -> 78, Van Dijk 1920 63 -> 66 and 2122 62 -> 65, Busquets 1920
# 84 -> 88. Modric 1718 loses a point, 82 -> 81, which is the trade: a player
# who is good at everything and best at nothing gives way slightly.
#
# Set to 0 to score on the weighted mean alone.
peak_weight: 0.15

# Minimum minutes before a player is rated. Below this the sample is too thin
# for percentiles to mean anything, however hard shrinkage works.
min_minutes: 450

# Minimum peers in a (role, season) pool before it is rated at all.
#
# A percentile is only meaningful against a real distribution. Five matchweeks
# into a season barely anyone has cleared the minutes floor, so whoever has
# lands in the 99th percentile of a pool of twelve.
min_group_size: 40

# Empirical-Bayes shrinkage strength, in 90-minute appearances.
#
# A player's composite is pulled toward their role's mean with weight
# k / (n + k). At k = 8, eight full matches sits halfway between their own
# numbers and the role average; by thirty they are ~79% their own.
#
# This interacts with position: goalkeepers play whole seasons and so are shrunk
# least, which is why ratings are ranked within role rather than across all
# players.
shrinkage_nineties: 8

# Roles. Weights within a sub-rating are relative and get normalised, so only
# their ratios matter. A negative weight means lower is better.
positions:
  FWD:
    label: Forward
    sub_ratings:
      finishing:
        np_xg_per90: 3.0
        np_goals_per90: 2.0
        finishing_delta_per90: 0.5   # deliberately small: mostly variance
      creation:
        xa_per90: 2.5
        key_passes_per90: 1.5
        assists_per90: 1.0
      volume:
        shots_per90: 1.0
      involvement:
        xg_chain_share: 0.75
        xg_chain_per90: 0.75
        xg_buildup_share: 0.25
        xg_buildup_per90: 0.25
    sub_rating_weights:
      finishing: 0.45
      creation: 0.22
      volume: 0.13
      involvement: 0.20

  AMW:
    label: Attacking midfielder / winger
    sub_ratings:
      # Split from central midfield because the jobs differ: wingers and number
      # tens are judged on what they produce in the final third, not on how much
      # of the build-up runs through them.
      creation:
        xa_per90: 3.0
        key_passes_per90: 2.0
        assists_per90: 1.0
      finishing:
        np_xg_per90: 2.5
        np_goals_per90: 2.0
        finishing_delta_per90: 0.3
      involvement:
        xg_chain_share: 1.0
        xg_chain_per90: 1.0
        xg_buildup_share: 0.5
        xg_buildup_per90: 0.5
      volume:
        shots_per90: 1.0
      defending:
        interceptions_per90: 0.5
        interceptions_padj: 0.5
        tackles_won_per90: 0.5
        tackles_won_padj: 0.5
    sub_rating_weights:
      creation: 0.34
      finishing: 0.28
      involvement: 0.22
      volume: 0.08
      defending: 0.08

  DM:
    label: Defensive midfielder
    sub_ratings:
      # The same metrics and the same weights as MID, deliberately. What was
      # wrong was the *pool*, not the scoring: a holder was ranked for chance
      # creation against number eights and lost by 5.2 rating points on
      # average, taking 18% of each season's top fifty while being 40% of the
      # players. Compared with his own kind on identical terms the gap closes
      # to 0.1 and his share reaches 38%.
      #
      # Re-weighting toward defending and build-up was measured too --
      # defending 0.40, involvement 0.32, creation 0.18 -- and rejected: the
      # midfield line's correlation with next season's points fell from 0.646
      # to 0.634 while the overall barely moved. Separate the players, not the
      # yardstick.
      creation:
        xa_per90: 3.0
        key_passes_per90: 2.0
        assists_per90: 1.0
      involvement:
        xg_chain_share: 1.0
        xg_chain_per90: 1.0
        xg_buildup_share: 1.0
        xg_buildup_per90: 1.0
      finishing:
        np_xg_per90: 2.0
        np_goals_per90: 1.5
        finishing_delta_per90: 0.3
      volume:
        shots_per90: 1.0
      defending:
        interceptions_per90: 1.0
        interceptions_padj: 1.0
        tackles_won_per90: 1.0
        tackles_won_padj: 1.0
    sub_rating_weights:
      creation: 0.28
      involvement: 0.27
      finishing: 0.17
      defending: 0.20
      volume: 0.08

  MID:
    label: Central midfielder
    sub_ratings:
      creation:
        xa_per90: 3.0
        key_passes_per90: 2.0
        assists_per90: 1.0
      involvement:
        xg_chain_share: 1.0
        xg_chain_per90: 1.0
        xg_buildup_share: 1.0        # build-up matters most in central midfield
        xg_buildup_per90: 1.0
      finishing:
        np_xg_per90: 2.0
        np_goals_per90: 1.5
        finishing_delta_per90: 0.3
      volume:
        shots_per90: 1.0
      defending:
        interceptions_per90: 1.0
        interceptions_padj: 1.0
        tackles_won_per90: 1.0
        tackles_won_padj: 1.0
    sub_rating_weights:
      creation: 0.28
      involvement: 0.27
      finishing: 0.17
      defending: 0.20
      volume: 0.08

  FB:
    label: Full back
    sub_ratings:
      # Full-backs are separated from centre-backs because they are judged on
      # both jobs. Merging them is what previously let overlapping full-backs
      # out-rate every genuine centre-back.
      #
      # Possession-adjusted only -- see the note on CB below.
      defending:
        interceptions_padj: 2.5
        tackles_won_padj: 2.5
        fouls_per90: -0.5
        # Quality beside volume. The volume terms answer "how much defending
        # did he do", which a centre back at a dominant side does little of --
        # Van Dijk sits at the 3rd to 11th percentile for it in every Liverpool
        # season. These two ask how good the defending was: what share of his
        # challenges ended with the ball rather than a free kick, and how much
        # he wins per foul given away. On those he is 70th to 97th percentile.
        #
        # FBref strips tackle attempts from player rows, so a true success rate
        # is out of reach; fouls stand in for failed challenges.
        clean_challenge_rate: 1.0
        ball_won_per_foul: 1.0
      creation:
        crosses_per90: 2.0
        xa_per90: 2.0
        key_passes_per90: 1.5
        assists_per90: 1.0
      involvement:
        xg_buildup_share: 1.5
        xg_buildup_per90: 1.5
        xg_chain_share: 1.0
        xg_chain_per90: 1.0
      finishing:
        np_xg_per90: 1.0
        np_goals_per90: 1.0
      # Defined and weighted **zero**, which is a decision rather than an
      # omission. Full backs share the centre backs' defending definition
      # exactly, so they share its defect, and the same fix was measured here
      # on top of the chosen CB setting (`--stage fb --cb-share 0.30`):
      #
      #   FB team_defence  RPS       delta (95% CI)               defence vs next GA
      #   0.00             0.19912   --                            -0.523   <- this
      #   0.15             0.19915   +0.00003 [-0.00009,+0.00016]  -0.541
      #   0.30             0.19913   +0.00001 [-0.00012,+0.00014]  -0.554
      #
      # On those aggregates 0.30 wins outright, and it is still not shipped.
      # Its RPS advantage -- the only significant result anywhere in this
      # experiment -- improved in just 8 of the 11 seasons that can move,
      # p ~ 0.11, carried by 2122 and 2223 and cancelled by 1819 and 2425.
      # Matches inside a season share a model fit, so the paired bootstrap's
      # effective sample is nearer 12 than 20,060 and a CI of
      # [-0.00065, -0.00028] can sit on top of a coin-flip season record.
      #
      # What is left is a validity gain at a steep editorial price. The pool
      # here is 0.38, so taking 0.30 would leave a full back rated 8% on
      # ball-winning and 30% on his club's clean sheets -- the variant where a
      # player's published number is least about the player. That is a product
      # decision, not a statistical conclusion, and it has not been taken.
      #
      # Worth recording for whoever runs this next: before the `peak_weight`
      # leak was closed this table ran the *other* way, every step toward full
      # backs improving the correlation and worsening RPS. The reversal is
      # real -- the leak was feeding FB `team_defence` into every variant
      # including baseline -- but it means this arm's history is not a guide.
      # Left at zero, and the definition kept so the measurement can be
      # repeated rather than re-derived.
      team_defence:
        team_xga_per_match: -2.0
        team_ga_per_match: -1.0
        team_clean_sheet_pct: 1.0
    sub_rating_weights:
      defending: 0.38
      creation: 0.32
      involvement: 0.25
      finishing: 0.05
      team_defence: 0.0

  CB:
    label: Centre back
    sub_ratings:
      # Defending dominates, as it should for the role. Before FBref supplied
      # interceptions and tackles this group was judged on attacking output
      # alone, which was indefensible.
      #
      # Possession-adjusted only. The raw per-90 counts reward a defender for
      # playing on a team that has to defend a lot: Brentford sit deep, so
      # Nathan Collins scored 36 for defending while Damsgaard, a winger who
      # tracks back, scored 95. Dividing by the team's own defensive volume at
      # least asks "of the defending this side had to do, how much was his?".
      #
      # Measured over 1,052 completed team-seasons, against the NEXT season's
      # goals conceded -- the only test that matters, since strength is joined
      # from the previous season:
      #
      #   possession-adjusted only   -0.489   <- this
      #   raw + adjusted (before)    -0.483
      #   EA rating alone            -0.478
      #
      # A small gain, and close to the ceiling: knowing a team's *actual*
      # previous conceding predicts only -0.555, and the whole-squad `overall`
      # rating already reaches -0.519. A defence-specific number is therefore
      # largely redundant, which is why the match model ranks
      # `strength_defence` 93rd of 125 features. Do not expect re-weighting to
      # rescue it -- an earlier sweep of the FB defending weight from 0.38 to
      # 0.80 made things worse at every step. The metrics are the limit:
      # tackles and interceptions measure activity, and nothing in the free
      # data measures positioning or preventing a chance.
      defending:
        interceptions_padj: 3.0
        tackles_won_padj: 2.5
        fouls_per90: -0.5
        # Quality beside volume. The volume terms answer "how much defending
        # did he do", which a centre back at a dominant side does little of --
        # Van Dijk sits at the 3rd to 11th percentile for it in every Liverpool
        # season. These two ask how good the defending was: what share of his
        # challenges ended with the ball rather than a free kick, and how much
        # he wins per foul given away. On those he is 70th to 97th percentile.
        #
        # FBref strips tackle attempts from player rows, so a true success rate
        # is out of reach; fouls stand in for failed challenges.
        clean_challenge_rate: 1.0
        ball_won_per_foul: 1.0
      involvement:
        xg_buildup_share: 1.5
        xg_buildup_per90: 1.5
        xg_chain_share: 0.5
        xg_chain_per90: 0.5
      creation:
        xa_per90: 1.0
        key_passes_per90: 0.5
      finishing:
        np_xg_per90: 1.0
        np_goals_per90: 1.0          # set-piece goals are real value from a CB
      # What actually happened at the other end, which the group above cannot
      # see. Measured across 859 team-seasons, the back line's `defending`
      # correlates **+0.10** with the goals its team conceded -- not weak,
      # backwards -- because every input counts defensive *actions*, and a
      # defender makes more of them when his side defends worse.
      #
      # This is not a new idea here. The `GK` block below already rates a
      # keeper 97% on outcomes (`goals_against_per90: -2.0`, `clean_sheet_pct`)
      # while the defenders in front of him are rated 0% on them. Same sign
      # convention: negative means lower is better.
      #
      # Weighted 0.30, chosen by `python -m pipelines.defending_sweep` over
      # 20,060 walk-forward fixtures. Two earlier runs reached a number and
      # were thrown away: one had a club-name join missing 26.6% of defenders,
      # one had `peak_weight` letting zero-weighted groups into the published
      # rating, so its baseline was not production behaviour. These are the
      # figures from the third run, on a 100% join and a peak that respects a
      # zero weight:
      #
      #   variant        RPS       delta (95% CI)               defence vs next GA
      #   share-0.62     0.19911   -0.00001 [-0.00014,+0.00013]  -0.440   <- was shipped
      #   share-0.00     0.19914   +0.00003 [-0.00011,+0.00017]  -0.486
      #   team_def 0.15  0.19913   +0.00002 [-0.00012,+0.00015]  -0.490
      #   team_def 0.30  0.19912   --                            -0.523   <- this
      #   team_def 0.45  0.19908   -0.00003 [-0.00017,+0.00010]  -0.544
      #
      # Re-measured 2026-10-18 on 20,074 fixtures. The figures this block
      # carried until then were scored through `rps_per_match` with integer
      # outcome labels, which `_one_hot` matched against the strings 'H'/'D'/'A'
      # -- so every indicator was zero and RPS reduced to a function of the
      # forecast that never read the result. Shuffling every outcome left it
      # unchanged. The tell was a score near 0.36 where `evaluate.py` says a
      # base rate lands at 0.22; it now raises on a non-H/D/A label.
      #
      # **No predictive improvement is established, and none is claimed.** Not
      # one variant is significant on RPS, the chosen one included, and the
      # whole table spans 0.00012 -- from 0.19908 to 0.19918. Against the
      # setting this replaced (`share-0.62`) the change is +0.00001, which is
      # nil. RPS cannot separate any of these configurations, which is the
      # entire reason the choice rests on the correlations below.
      #
      # It ships on defensive validity, which does replicate. Centre-back line
      # against the *next* season's conceding, with full-back weights held
      # fixed as a control that does not move:
      #
      #                  vs GA    vs xGA   vs npxGA   vs EA `fifa_overall`
      #   baseline       -0.381   -0.400   -0.368     +0.778
      #   share-0.00     -0.463   -0.465   -0.435     +0.803
      #   team_def 0.30  -0.544   -0.558   -0.531     +0.833
      #
      # It improves in all five leagues on all three outcome measures, 15 cells
      # of 15, and it agrees *more* with EA's independently scouted overall --
      # the part that is hardest to explain as fitting our own second metric.
      #
      # Two things the sweep settles beyond the choice. Deleting `defending`
      # outright -- `share-0.00`, 62% of the composite -- does not make the
      # model worse, which is what a backwards signal looks like from the other
      # side; it is rejected because it leaves a centre-back rated on
      # involvement, creation and finishing with no defensive content at all,
      # behind a bar the page labels "Ball-winning". And 0.45 buys a better
      # correlation while predicting no better: past some point the club's
      # record crowds out what the rating knows about the player.
      #
      # The honest limitation: this is a *club* number, so Saliba and Gabriel
      # both take Arsenal's 98 and both land on 85, and Marc Guehi drops 83 to
      # 81 for playing well in a leaky side. It fixes the between-club problem
      # and not the within-club one.
      team_defence:
        team_xga_per_match: -2.0
        team_ga_per_match: -1.0
        team_clean_sheet_pct: 1.0
    sub_rating_weights:
      defending: 0.32
      involvement: 0.24
      creation: 0.07
      finishing: 0.07
      team_defence: 0.30

  GK:
    label: Goalkeeper
    sub_ratings:
      # FBref keeper stats, not FIFA ratings, for the performance half. Save
      # percentage is what happened; a FIFA rating is an opinion. The blend
      # brings EA's judgement back in at `fifa_weight`.
      #
      # Caveat: without post-shot xG there is no adjustment for shot difficulty,
      # so a keeper behind a poor defence faces harder chances and is
      # understated. Workload is a partial counterweight.
      shot_stopping:
        save_pct: 3.0
        goals_against_per90: -2.0
      reliability:
        clean_sheet_pct: 2.0
      workload:
        shots_on_target_against_per90: 1.0
      penalties:
        penalties_saved_per90: 1.0
    sub_rating_weights:
      shot_stopping: 0.72
      reliability: 0.25
      penalties: 0.03
      # Workload is reported but carries no weight. It was meant to credit a
      # keeper who faces more and still saves them, but in practice it punished
      # every keeper behind a good defence: Neuer faces few shots at Bayern and
      # was marked down for it. Shot-stopping already measures the thing that
      # matters, and save percentage is a rate, so it needs no volume
      # adjustment.
      workload: 0.0

# Discipline applies to every outfield role and only ever subtracts.
discipline:
  weight: 0.03
  metrics:
    yellow_cards_per90: 1.0
    red_cards_per90: 3.0

# Composite percentile -> 0-99, by interpolating between these anchors.
#
# Shaped like ratings people already read: a crowded middle around 65-72, a long
# thin tail at the top, nobody at 99.
scale:
  - [0.00, 48]
  - [0.10, 58]
  - [0.25, 63]
  - [0.50, 68]
  - [0.75, 74]
  - [0.90, 79]
  - [0.97, 85]
  - [0.995, 90]
  - [1.00, 94]
